<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact | Luke Squire</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">Luke Squire</a>
      <nav class="nav" aria-label="Primary">
        <a class="nav__link" href="projects.html">Projects</a>
        <a class="nav__link" href="about.html">About</a>
        <a class="nav__link" href="resume.html">Resume</a>
        <a class="nav__link nav__link--cta" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">

      <div class="section__header">
        <h1 class="h2">Contact</h1>
        <p class="section__sub">
          For product leadership roles, advisory work, or strategic conversations.
        </p>
      </div>

      <div class="panel">

        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">

          <label>
            Name
            <input type="text" name="name" required>
          </label>

          <label>
            Email
            <input type="email" name="email" required>
          </label>

          <label>
            Company
            <input type="text" name="company">
          </label>

          <label>
            Message
            <textarea name="message" rows="5" required></textarea>
          </label>

          <!-- Honeypot field for bots -->
          <input type="text" name="_gotcha" style="display:none">

          <button type="submit" class="btn btn--primary">Send Message</button>

        </form>

      </div>

      <div style="margin-top:40px;">
        <p>
          You can also connect with me on 
          <a href="https://linkedin.com/in/lukesquire/" target="_blank">
            LinkedIn
          </a>.
        </p>
      </div>

    </div>
  </main>
</body>
</html>
